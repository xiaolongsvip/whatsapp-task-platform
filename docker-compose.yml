services:
  postgres:
    image: postgres:17-alpine
    container_name: wtp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtp_dev
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: wtp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtp_dev -d wtp_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wtp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

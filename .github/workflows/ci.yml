name: CI

on:
  push:
    branches: [main, feature/automatic-task-slot-allocation]
  pull_request:
    branches: [main]

concurrency:
  group: wtp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://wtp_dev:local_only_change_me@localhost:5432/wtp_dev?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: TypeScript checks
        run: pnpm typecheck

      - name: Web ESLint
        run: pnpm --filter @wtp/web lint

      - name: Admin ESLint
        run: pnpm --filter @wtp/admin lint

      # API lint currently reports pre-existing violations in unrelated modules;
      # API typecheck and source-contract tests remain mandatory in backend-check.yml.

      - name: Production builds
        run: pnpm build
